   name: Hent kundeaviser ukentlig

   on:
     schedule:
       - cron: "17 5 * * 1"  # Hver mandag kl. 05:17 UTC (ca. 06:17–07:17 norsk tid).
                              # Bevisst forskjøvet fra rundt klokkeslett (05:00): GitHub
                              # kan forsinke schedule-triggere betydelig i timens første
                              # minutter pga. global kø (mange repoer bruker "0 X * * *").
                              # Sett 24.08.2026 etter at uke 34-kjøringen kom 3 timer for
                              # sent (kl. 08:03 i stedet for 05:00).
     workflow_dispatch:        # Lar deg trykke "Run workflow" manuelt for å teste
       inputs:
         full_kjoring:
           description: "Ekstraher alle 7 kjeder denne kjøringen (ignorerer rotasjonen, se kundeavis_bot.py)"
           type: boolean
           default: false

   permissions:
     contents: write   # trengs for å committe/pushe kundeaviser/latest.json tilbake til repoet
     id-token: write    # trengs av anthropics/claude-code-action for å hente en OIDC-token —
                         # uten denne feiler steget med "Could not fetch an OIDC token", selv om
                         # selve Anthropic-autentiseringen bruker CLAUDE_CODE_OAUTH_TOKEN (ikke
                         # OIDC). Dette gikk upåaktet hen tidligere fordi steget kun gjorde en
                         # valgfri, continue-on-error lett verifisering — nå er det selve
                         # OCR/vision-ekstraksjonen som feiler stille uten denne.

   jobs:
     hent-kundeaviser:
       runs-on: ubuntu-latest
       steps:
         - name: Sjekk ut repoet
           uses: actions/checkout@v4

         - name: Sett opp Python
           uses: actions/setup-python@v5
           with:
             python-version: "3.12"

         - name: Installer avhengigheter
           run: pip install requests Pillow

         - name: Kjør kundeavis-scriptet
           env:
             FULL_KJORING: ${{ inputs.full_kjoring }}
           run: python kundeavis_bot.py

         # Kjører Claude Code direkte på runneren (som allerede har full
         # nettilgang og PDF-ene på disk) rett etter at de er generert, og
         # gjør full OCR/vision-basert strukturering av tilbudene — ikke
         # bare en lett verifisering (se git-historikk for det opprinnelige,
         # enklere verifiseringssteget dette erstattet). Leser kun kjedene i
         # aktive_kjeder_denne_uken (se kundeavis_bot.py sin rotasjonslogikk)
         # for å holde denne — langt tyngre — Claude-bruken nede.
         #
         # Bruker CLAUDE_CODE_OAUTH_TOKEN (Pro/Max-abonnement), IKKE
         # ANTHROPIC_API_KEY — dermed telles bruken mot det abonnementet du
         # allerede betaler for, ikke separat pay-per-use API-fakturering.
         # Generer token lokalt: `claude setup-token` (krever at du er
         # innlogget med Pro/Max-kontoen din), og legg den inn som
         # repo-secret CLAUDE_CODE_OAUTH_TOKEN (Settings → Secrets and
         # variables → Actions → New repository secret).
         # continue-on-error: hvis secreten mangler eller ekstraksjonen
         # feiler, skal ikke selve kundeavis-jobben (PDF-hentingen) stoppes
         # — latest-strukturert.json blir da bare stående som den var.
         - name: Strukturer tilbud med Claude (OCR/vision-ekstraksjon)
           uses: anthropics/claude-code-action@v1
           continue-on-error: true
           with:
             claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
             prompt: |
               Finn den nyeste ukesmappen under kundeaviser/ (mønster
               kundeaviser/ÅÅÅÅ-ukeNN/) og les _status.json der. Feltet
               "aktive_kjeder_denne_uken" lister hvilke kjede-nøkler som
               skal prosesseres denne kjøringen — prosesser en kjede KUN
               hvis nøkkelen står i den listen OG resultater.<nøkkel>.status
               er "ok".

               For hver slik kjede: åpne kundeaviser/latest/<nøkkel>.pdf med
               Read-verktøyet (returnerer alle sider). Se gjennom HVER side
               og identifiser tilbud.

               KATEGORIFILTER — ta KUN med varer i disse kategoriene:
               kjøtt, fisk, fjørfe, meieri, tørrvarer, frukt/grønt, brød,
               pålegg, belgfrukter, frossenmat. Ignorer helt: klær,
               vaskemidler/rengjøring, dyremat, elektronikk, blomster, sko,
               hygieneartikler, kjøkkenutstyr, sport, leker, hagevarer og
               alt annet som ikke er i listen over.

               FAST LAVPRIS vs. UKESTILBUD — norske kjeder har egne faste
               lavpris-konsepter (f.eks. "Alltid lave priser", "Vi gir oss
               aldri på pris", "Fast lav pris") som IKKE er tidsbegrensede
               ukestilbud. Skill disse ut: de skal IKKE i tilbud-listen, men
               i en egen faste_lavpriser-liste (se filformat under).

               BUNT-TILBUD — hvis prisen gjelder for flere enheter samtidig
               (f.eks. "3 for 100" eller "2 for 50"), sett er_bunt_tilbud=true
               og la pris_nå være totalprisen for bunten (ikke omregnet
               per stykk).

               TRYKT ORIGINALPRIS — bruk kun en pris_før-verdi hvis en
               original/før-pris faktisk står trykt på siden (f.eks.
               overstrøket pris). Gjett ALDRI en før-pris — sett null hvis
               den ikke er synlig.

               Skriv to filer (overskriv hvis de finnes):

               kundeaviser/latest-strukturert.json:
               {
                 "uke": "<ukeNN fra _status.json>",
                 "oppdatert": "<dagens dato, ÅÅÅÅ-MM-DD>",
                 "kjeder_denne_kjøringen": [<liste over kjede-nøkler faktisk prosessert>],
                 "tilbud": [
                   {
                     "kjede": "<kjede-nøkkel>",
                     "side": <sidetall, 1-indeksert>,
                     "produkt": "<produktnavn slik det står>",
                     "kategori": "<én av kategoriene over>",
                     "pris_nå": <tall, kr>,
                     "pris_før": <tall eller null>,
                     "enhet": "<f.eks. 'kg', 'stk', 'pk', eller null>",
                     "er_bunt_tilbud": <true/false>
                   }
                 ]
               }

               kundeaviser/latest-faste-lavpriser.json:
               {
                 "oppdatert": "<dagens dato, ÅÅÅÅ-MM-DD>",
                 "faste_lavpriser": [
                   {
                     "kjede": "<kjede-nøkkel>",
                     "produkt": "<produktnavn>",
                     "kategori": "<kategori>",
                     "pris": <tall, kr>,
                     "enhet": "<eller null>"
                   }
                 ]
               }

               Skriv til slutt en kort oppsummering til stdout: antall
               tilbud og faste lavpriser funnet per kjede. Ikke gjør andre
               filendringer eller commits.
             claude_args: |
               --allowedTools "Read,Glob,Bash(cat:*),Write"
               --max-turns 60

         # Committer og pusher kundeaviser/latest.json + kundeaviser/latest/*.pdf
         # + de to strukturerte JSON-filene (faste filstier, overskrevet
         # hver uke — se .gitignore for begrunnelsen for at nettopp disse
         # PDF-ene er unntatt fra regelen om at kjedenes
         # opphavsrettsbeskyttede innhold ellers ikke committes) tilbake til
         # repoet. Dette gir STABILE rå-URLer
         # (raw.githubusercontent.com/.../kundeaviser/latest.json,
         # .../kundeaviser/latest/<kjede>.pdf,
         # .../kundeaviser/latest-strukturert.json og
         # .../kundeaviser/latest-faste-lavpriser.json) som en ekstern
         # AI-bot (f.eks. et Claude Project) kan hente for å alltid få denne
         # ukens tilbud — inkludert et ferdig OCR/vision-ekstrahert,
         # matkategori-filtrert JSON-format i stedet for å måtte lese 100+
         # rastrerte avisside-bilder for hånd. latest-strukturert.json/
         # latest-faste-lavpriser.json legges kun til hvis Claude-steget
         # over faktisk skrev dem (kan mangle ved feil/manglende secret).
         # Hopper over commit hvis ingenting endret seg.
         #
         # git remote set-url før push: claude-code-action-steget over
         # konfigurerer sin EGEN, midlertidige GitHub App-token for git
         # (den trenger det til sine egne operasjoner) og
         # tilbakekaller/rydder opp i den i sitt post-job-steg. Hvis dette
         # steget her stoler på det credential-oppsettet som da allerede er
         # i endring, feiler push med "Invalid username or token" (sett i
         # praksis 26.08.2026). Ved å eksplisitt sette remote-URL-en med
         # GITHUB_TOKEN (repoets egen, stabile Actions-token) rett før push
         # unngår vi den avhengigheten helt.
         - name: Oppdater latest.json, PDF-er og strukturerte tilbud for eksterne AI-boter
           env:
             GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
             git config user.name "github-actions[bot]"
             git config user.email "github-actions[bot]@users.noreply.github.com"
             git add kundeaviser/latest.json kundeaviser/latest/
             [ -f kundeaviser/latest-strukturert.json ] && git add kundeaviser/latest-strukturert.json
             [ -f kundeaviser/latest-faste-lavpriser.json ] && git add kundeaviser/latest-faste-lavpriser.json
             if git diff --cached --quiet; then
               echo "Ingen endringer å committe."
             else
               git commit -m "Oppdater latest.json, PDF-er og strukturerte tilbud (automatisk, uke $(date +%V))"
               git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
               git push
             fi

         - name: Last opp resultatet som nedlastbar pakke
           uses: actions/upload-artifact@v4
           with:
             name: kundeaviser
             path: kundeaviser/
             retention-days: 14
