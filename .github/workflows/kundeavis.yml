   name: Hent kundeaviser ukentlig

   on:
     schedule:
       - cron: "0 5 * * 1"   # Hver mandag kl. 05:00 UTC (ca. 06:00–07:00 norsk tid)
     workflow_dispatch:        # Lar deg trykke "Run workflow" manuelt for å teste

   permissions:
     contents: write   # trengs for å committe/pushe kundeaviser/latest.json tilbake til repoet

   jobs:
     hent-kundeaviser:
       runs-on: ubuntu-latest
       steps:
         - name: Sjekk ut repoet
           uses: actions/checkout@v4

         - name: Sett opp Python
           uses: actions/setup-python@v5
           with:
             python-version: "3.12"

         - name: Installer avhengigheter
           run: pip install requests Pillow

         - name: Kjør kundeavis-scriptet
           run: python kundeavis_bot.py

         # Committer og pusher kundeaviser/latest.json (fast filsti, kun
         # Tjek sine egne bilde-lenker — ikke kopier av selve avisene, se
         # .gitignore) tilbake til repoet. Dette gir en STABIL rå-URL
         # (raw.githubusercontent.com/.../kundeaviser/latest.json) som en
         # ekstern AI-bot (f.eks. et Claude Project) kan hente for å alltid
         # få denne ukens tilbud, uten at boten selv trenger å konstruere
         # noen URL. Hopper over commit hvis ingenting endret seg (f.eks.
         # samme ukes kundeaviser hentet på nytt samme dag).
         - name: Oppdater latest.json for eksterne AI-boter
           run: |
             git config user.name "github-actions[bot]"
             git config user.email "github-actions[bot]@users.noreply.github.com"
             git add kundeaviser/latest.json
             if git diff --cached --quiet; then
               echo "Ingen endringer i latest.json - hopper over commit."
             else
               git commit -m "Oppdater latest.json (automatisk, uke $(date +%V))"
               git push
             fi

         # Kjører Claude Code direkte på runneren (som allerede har full
         # nettilgang og filene på disk) rett etter at PDF-ene er generert.
         # Ingen nedlasting nødvendig — Claude leser PDF-ene lokalt her og
         # skriver funnene sine til jobb-loggen, som kan leses etterpå via
         # GitHub sitt API (f.eks. av en Claude Code-økt et annet sted).
         #
         # Bruker CLAUDE_CODE_OAUTH_TOKEN (Pro/Max-abonnement), IKKE
         # ANTHROPIC_API_KEY — dermed telles bruken mot det abonnementet du
         # allerede betaler for, ikke separat pay-per-use API-fakturering.
         # Generer token lokalt: `claude setup-token` (krever at du er
         # innlogget med Pro/Max-kontoen din), og legg den inn som
         # repo-secret CLAUDE_CODE_OAUTH_TOKEN (Settings → Secrets and
         # variables → Actions → New repository secret).
         # continue-on-error: hvis secreten mangler eller verifiseringen
         # feiler, skal ikke selve kundeavis-jobben stoppes.
         - name: Verifiser kundeaviser med Claude
           uses: anthropics/claude-code-action@v1
           continue-on-error: true
           with:
             claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
             prompt: |
               Finn den nyeste ukesmappen under kundeaviser/ (mønster
               kundeaviser/ÅÅÅÅ-ukeNN/) og les _status.json der for å se
               hvilke kjeder som ble markert "ok".

               For hver PDF-fil som er markert "ok": åpne PDF-en med
               Read-verktøyet og vurder om innholdet faktisk ser ut som en
               ekte, flersidig norsk dagligvare-kundeavis (priser, produkter,
               kjedens logo/navn) — ikke en tom, feilrendret eller
               cookie-banner-blokkert side. Noter omtrent hvor mange sider
               som har reelt tilbudsinnhold.

               Skriv til slutt en kort, strukturert rapport til stdout — én
               linje per kjede i formatet:
               "KJEDE=<nøkkel> SIDER=<antall> OK=<ja/nei> KOMMENTAR=<kort forklaring>"
               etterfulgt av en total oppsummeringslinje. Ikke gjør noen
               filendringer eller commits — dette er kun en lese-verifisering.
             claude_args: |
               --allowedTools "Read,Glob,Bash(ls:*),Bash(cat:*)"
               --max-turns 20

         - name: Last opp resultatet som nedlastbar pakke
           uses: actions/upload-artifact@v4
           with:
             name: kundeaviser
             path: kundeaviser/
             retention-days: 14
