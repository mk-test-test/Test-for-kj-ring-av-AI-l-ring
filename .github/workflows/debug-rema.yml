name: Debug REMA 1000-selectorer

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer avhengigheter
        run: pip install requests beautifulsoup4 playwright Pillow

      - name: Installer Playwright sin Chromium
        run: playwright install --with-deps chromium

      - name: Kjør diagnose-script
        run: python debug_rema.py

      - name: Last opp skjermbilder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-rema-screenshots
          path: |
            debug_rema.png
            debug_mattilbud_rema.png
          retention-days: 3
          if-no-files-found: warn
