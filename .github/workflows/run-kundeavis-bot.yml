name: Kjør kundeavis-bot

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Python-avhengigheter
        run: pip install requests beautifulsoup4 playwright Pillow

      - name: Installer Playwright sin Chromium
        run: playwright install --with-deps chromium

      - name: Kjør kundeavis_bot.py
        run: python kundeavis_bot.py

      - name: Last opp resultater som artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kundeaviser
          path: kundeaviser/
          retention-days: 7
          if-no-files-found: warn
